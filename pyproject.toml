[project]
name = "bcl-python"
version = "0.1.0"
description = "Altissimo Python client for bcl-python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Altissimo HQ" },
]
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0",
    "google-auth>=2.20.0",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "altissimo", from = "src" }
]

[tool.poetry.group.dev.dependencies]
mypy = ">=1.15"
pytest = ">=8.0"
pytest-cov = ">=5.0"
pytest-asyncio = ">=0.24"
ruff = ">=0.9"
pre-commit = ">=4.0"
types-requests = ">=2.28"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "PT", "TCH", "RUF"
]

[tool.ruff.lint.isort]
known-first-party = ["altissimo"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PT011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["altissimo"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

